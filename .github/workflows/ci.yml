name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true

  # Deploy a Cloudflare sólo cuando CI pasa en main. La URL del deploy hook
  # es un secreto: vive en el secret CLOUDFLARE_DEPLOY_HOOK, nunca en el repo.
  deploy:
    name: deploy (Cloudflare)
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: false
    steps:
      - name: Disparar el deploy hook de Cloudflare Workers Builds
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Falta el secret CLOUDFLARE_DEPLOY_HOOK (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 -X POST "$DEPLOY_HOOK"
          echo
          echo "Deploy solicitado para ${GITHUB_SHA::7}. El build corre en Cloudflare (Workers & Pages → tu Worker → Deployments)."
